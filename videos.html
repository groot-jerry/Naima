<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Our Memories 🎥</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
            font-size: 32px;
            animation: fadeIn 2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grid Layout */
        .video-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        /* Video Style */
        iframe {
            width: 100%;
            height: 200px;
            border-radius: 15px;
            border: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        iframe:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
        }

        /* Button Style */
        button {
            margin-top: 30px;
            padding: 12px 25px;
            border: none;
            background: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover {
            background: black;
            color: white;
        }
    </style>
</head>

<body>

<h1>Our Memories 🎥</h1>

<div class="video-container">
