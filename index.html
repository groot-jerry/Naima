<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sorry ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 10;
        }

        h1 { color: #ff4d6d; }
        p { font-size: 18px; color: #333; }

        #typed {
            color: #ff4d6d;
            font-weight: bold;
        }

        .anniv-btn {
            margin-top: 15px;
            padding: 10px 20px;
            border: none;
            background: #ff4d6d;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            transform: rotate(45deg);
        }

        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: red;
            border-radius: 50%;
        }

        .heart::before { top: -10px; }
        .heart::after { left: -10px; }

        /* Gallery */
        .gallery {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 20;
        }

        /* Heart shape */
        .heart-bg {
            width: 300px;
            height: 300px;
            background: red;
            position: relative;
            transform: rotate(-45deg);
        }

        .heart-bg::before,
        .heart-bg::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: red;
            border-radius: 50%;
        }

        .heart-bg::before {
            top: -150px;
            left: 0;
        }

        .heart-bg::after {
            left: 150px;
            top: 0;
        }

        .heart-bg img {
            position: absolute;
            width: 200px;
            height: 200px;
            object-fit: cover;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            border-radius: 10px;
            transition: opacity 0.5s ease-in-out;
        }

        .controls button {
            margin: 10px;
            padding: 10px 15px;
            border: none;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="card">
        <h1>Sorry "Jaan Pakhi" 💔</h1>
        <p>You matter to me. I love you a lot ❤️</p>
        <p id="typed"></p>
        <p>Onk kosto kore eta banailam just for you Jaan. Please maaf kore dao.</p>

        <button onclick="openGallery()" class="anniv-btn">
            Happy 4 Months Anniversary ❤️
        </button>
    </div>

    <!-- Gallery -->
    <div id="gallery" class="gallery">
        <div class="heart-bg">
            <img id="slide" src="img/1.jpg">
        </div>

        <div class="controls">
            <button onclick="prevSlide()">⬅ Prev</button>
            <button onclick="nextSlide()">Next ➡</button>
            <button onclick="closeGallery()">Close ❌</button>
        </div>
    </div>

    <!-- Music -->
    <audio autoplay loop>
        <source src="https://www.bensound.com/bensound-music/bensound-summer.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Typing effect
        const message = "Please forgive me ❤️";
        let i = 0;
        const typed = document.getElementById("typed");

        function typeWriter() {
            if (i < message.length) {
                typed.innerHTML += message.charAt(i);
                i++;
                setTimeout(typeWriter, 150);
            }
        }
        typeWriter();

        // Floating hearts
        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");

            heart.style.left = Math.random() * window.innerWidth + "px";
            heart.style.top = Math.random() * window.innerHeight + "px";

            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 5000);
        }

        setInterval(createHeart, 300);

        // Slideshow images (img folder)
        const images = [
            "img/1.jpg",
            "img/2.jpg",
            "img/3.jpg"
        ];

        let current = 0;
        let slideInterval;

        function openGallery() {
            document.getElementById("gallery").style.display = "flex";
            showSlide(current);

            slideInterval = setInterval(() => {
                nextSlide();
            }, 2000);
        }

        function closeGallery() {
            document.getElementById("gallery").style.display = "none";
            clearInterval(slideInterval);
        }

        function showSlide(index) {
            document.getElementById("slide").src = images[index];
        }

        function nextSlide() {
            current = (current + 1) % images.length;
            showSlide(current);
        }

        function prevSlide() {
            current = (current - 1 + images.length) % images.length;
            showSlide(current);
        }
    </script>

</body>
</html>
