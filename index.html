<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sorry ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', sans-serif;
            position: relative;
            overflow: hidden;
        }

        /* Background Text */
        .bg-text {
            position: absolute;
            color: rgba(255, 255, 255, 0.25);
            font-size: 60px;
            font-weight: bold;
            pointer-events: none;
        }

        #bg-i {
            top: 20px;
            left: 20px;
        }

        #bg-love {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        #bg-you {
            top: 20px;
            right: 20px;
        }

        #bg-naima {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            animation: glow 2s infinite alternate;
        }

        /* Heart Outline with Pulse */
        #bg-heart {
            position: absolute;
            font-size: 100px;
            color: transparent;
            -webkit-text-stroke: 3px rgba(255,255,255,0.4);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1.5s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }


        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 10;
        }

        h1 { color: #ff4d6d; margin-bottom: 10px; }
        p { font-size: 18px; margin: 5px 0; }
        #typed { color: #ff4d6d; font-weight: bold; }

        #click-note {
            font-size: 14px;
            color: #ff4d6d;
            font-style: italic;
            margin-top: 15px;
            margin-bottom: 15px;
            animation: blink 1.2s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0; }
        }

        button {
            margin-top: 10px;
            padding: 12px 20px;
            border: none;
            background: #ff4d6d;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff1a3c;
        }
    </style>
</head>

<body>

<!-- Background Elements -->
<div id="bg-i" class="bg-text">I</div>
<div id="bg-love" class="bg-text">Love</div>
<div id="bg-you" class="bg-text">You</div>
<div id="bg-naima" class="bg-text">Naima</div>
<div id="bg-heart">❤</div>

<!-- Main Card -->
<div class="card">
    <h1>I am Extremely Sorry "Jaan Pakhi" 💔</h1>
    <p>You matter to me ❤️</p>
    <p id="typed"></p>
    <div id="click-note">Click here ⬇️</div>
    <div style="display:flex; gap:10px; justify-content:center;">
    <button onclick="goToGallery()">Happy 4 Months Anniversary ❤️</button>
    <button onclick="goToVideos()">Our Memories 🎥</button>
</div>

<script>
    const msg = "Please forgive me ❤️";
    let i = 0;

    function typeWriter() {
        if (i < msg.length) {
            document.getElementById("typed").innerHTML += msg.charAt(i);
            i++;
            setTimeout(typeWriter, 120);
        }
    }
    typeWriter();

    function goToGallery() {
        window.location.href = "gallery.html";
    }
    function goToVideos() {
    window.location.href = "videos.html";
}
</script>

</body>
</html>
