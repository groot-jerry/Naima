<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Sorry ❤️</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', sans-serif;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 { color: #ff4d6d; margin-bottom: 10px; }
        p { font-size: 18px; margin: 5px 0; }
        #typed { color: #ff4d6d; font-weight: bold; }

        #click-note {
            font-size: 14px;
            color: #ff4d6d;
            font-style: italic;
            margin-top: 15px;  /* Added space above */
            margin-bottom: 15px;
            animation: blink 1.2s infinite;

        }

        button {
            margin-top: 10px;
            padding: 12px 20px;
            border: none;
            background: #ff4d6d;
            color: white;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff1a3c;
        }
    </style>
</head>

<body>
<div class="card">
    <h1>I am Extreamly Sorry "Jaan Pakhi" 💔</h1>
    <p>You matter to me ❤️</p>
    <p id="typed"></p>
    <div id="click-note">Click here ⬇️</div>
    <button onclick="goToGallery()">Happy 4 Months Anniversary ❤️</button>
</div>

<script>
    const msg = "Please forgive me ❤️";
    let i = 0;

    function typeWriter() {
        if (i < msg.length) {
            document.getElementById("typed").innerHTML += msg.charAt(i);
            i++;
            setTimeout(typeWriter, 120);
        }
    }
    typeWriter();

    function goToGallery() {
        window.location.href = "gallery.html";
    }
</script>
</body>
</html>
