<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Our Memories ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: 'Segoe UI', sans-serif;
            flex-direction: column;
        }

        h1 {
            color: white;
            margin-bottom: 20px;
        }

        #slide {
            width: 500px;
            height: 400px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        button {
            margin-top: 20px;
            padding: 10px 20px;
            border: none;
            background: white;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Happy 4 Months Anniversary ❤️</h1>

<img id="slide" src="">

<button onclick="goBack()">⬅ Back</button>

<audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-summer.mp3" type="audio/mpeg">
</audio>

<script>
let images = [];
let index = 0;

// Fetch images from Flask
fetch('/images')
    .then(res => res.json())
    .then(data => {
        images = data;
        if (images.length > 0) {
            document.getElementById("slide").src = images[0];
            startSlideshow();
        }
    });

function startSlideshow() {
    setInterval(() => {
        index = (index + 1) % images.length;
        document.getElementById("slide").src = images[index];
    }, 2000); // change image every 2 seconds
}

function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
